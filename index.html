  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0d0402; color: #fff; }

    /* ── slide transitions ── */
    .slide-fwd  { animation: slideFwd .38s cubic-bezier(.4,0,.2,1) both; }
    .slide-back { animation: slideBack .38s cubic-bezier(.4,0,.2,1) both; }
    @keyframes slideFwd  { from { opacity:0; transform:translateX(40px) scale(.97); } to { opacity:1; transform:translateX(0) scale(1); } }
    @keyframes slideBack { from { opacity:0; transform:translateX(-40px) scale(.97); } to { opacity:1; transform:translateX(0) scale(1); } }

    /* ── modal ── */
    .modal-bg   { animation: fadeBg .25s ease both; }
    @keyframes fadeBg { from { opacity:0; } to { opacity:1; } }
    .modal-sheet { animation: sheetUp .3s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes sheetUp { from { opacity:0; transform:translateY(60px); } to { opacity:1; transform:translateY(0); } }

    /* ── interactive cards ── */
    .icard { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; cursor: pointer; }
    .icard:hover { transform: translateY(-3px) scale(1.02); }
    .icard:active { transform: scale(.97); }

    /* ── buttons ── */
    .ibtn { transition: all .15s ease; position: relative; overflow: hidden; }
    .ibtn:hover { opacity:.85; transform: scale(1.05); }
    .ibtn:active { transform: scale(.93); }
    .ibtn::after { content:''; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,255,255,.25) 0%, transparent 70%); opacity:0; transition:opacity .3s; }
    .ibtn:active::after { opacity:1; }

    /* ── nav arrows ── */
    .nav-arr { transition: all .15s ease; }
    .nav-arr:not(:disabled):hover { background: rgba(255,255,255,.12) !important; transform: scale(1.08); }
    .nav-arr:active { transform: scale(.9); }

    /* ── tab ── */
    .camp-tab { transition: all .2s ease; position: relative; }
    .camp-tab::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; border-radius:2px; transform:scaleX(0); transition:transform .25s ease; }
    .camp-tab.active::after { transform:scaleX(1); }

    /* ── float ── */
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }

    /* ── pulse ── */
    .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(.85);} }

    /* ── glow text ── */
    .glow-text { text-shadow: 0 0 40px rgba(244,63,94,.5); }

    /* ── bar fill animation ── */
    .bar-fill { animation: barIn .6s cubic-bezier(.4,0,.2,1) both; }
    @keyframes barIn { from { width:0 !important; } }

    /* ── intensity dots ── */
    .dot-fill { animation: dotPop .3s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes dotPop { from { transform:scale(0); } to { transform:scale(1); } }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:4px; }

    /* ── top progress ── */
    #top-progress { transition: width .4s ease; }

    /* ── autoplay ring ── */
    .autoplay-ring { animation: spin 4s linear infinite; }
    @keyframes spin { to { stroke-dashoffset: -100; } }

    /* ── fullscreen ── */
    .fs-btn { transition: all .18s ease; }
    .fs-btn:hover { opacity:.85; transform: scale(1.08); background: rgba(255,255,255,.1) !important; }
    .app-fullscreen { position: fixed !important; inset: 0 !important; z-index: 9999 !important; background: #0d0402 !important; overflow-y: auto; }
  </style>
</head>

/* ── slide label map ─────────────────────────────────────────────── */
const slideLabel = { cover:'Capa', problem:'Problema', data:'Dados', offer:'Oferta', cta:'CTA',
  'seg-ter':'Seg & Ter', 'qua-qui':'Qua & Qui', sex:'Sexta', fds:'Fim de Semana',
  insight:'Insight', community:'Comunidade', promo:'Promoção' };

/* ── App ─────────────────────────────────────────────────────────── */
function App() {
  const [activeCamp, setActiveCamp]   = useState(0);
  const [activeSlide, setActiveSlide] = useState(0);
  const [dir, setDir]                 = useState('fwd');
  const [animKey, setAnimKey]         = useState(0);
  const [coffeeOpen, setCoffeeOpen]   = useState(null);
  const [autoPlay, setAutoPlay]       = useState(false);
  const [isFullscreen, setIsFullscreen] = useState(false);
  const touchX = useRef(null);
  const autoRef = useRef(null);

  const appRef = useRef(null);

  const toggleFullscreen = useCallback(() => {
    setIsFullscreen(fs => {
      const next = !fs;
      if (appRef.current) {
        appRef.current.classList.toggle('app-fullscreen', next);
      }
      return next;
    });
  }, []);

  const camp  = campaigns[activeCamp];
  const slide = camp.slides[activeSlide];
  const total = camp.slides.length;
  const accent = camp.accent;

  const goSlide = useCallback((delta) => {
    const next = activeSlide + delta;
    if (next < 0 || next >= total) return;
    setDir(delta > 0 ? 'fwd' : 'back');
    setAnimKey(k => k + 1);
    setActiveSlide(next);
  }, [activeSlide, total]);

  const jumpSlide = (i) => {
    setDir(i > activeSlide ? 'fwd' : 'back');
    setAnimKey(k => k + 1);
    setActiveSlide(i);
  };

  const switchCamp = (i) => {
    setActiveCamp(i);
    setActiveSlide(0);
    setDir('fwd');
    setAnimKey(k => k + 1);
    setAutoPlay(false);
  };

  /* keyboard */
  useEffect(() => {
    const h = (e) => {
      if (coffeeOpen) { if (e.key === 'Escape') setCoffeeOpen(null); return; }
      if (e.key === 'Escape' && isFullscreen) { toggleFullscreen(); return; }
      if (e.key === 'ArrowRight' || e.key === ' ') goSlide(1);
      if (e.key === 'ArrowLeft') goSlide(-1);
      if (e.key === '1') switchCamp(0);
      if (e.key === '2') switchCamp(1);
      if (e.key === '3') switchCamp(2);
      if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [goSlide, coffeeOpen, isFullscreen, toggleFullscreen]);

  /* autoplay */
  useEffect(() => {
    if (!autoPlay) { clearInterval(autoRef.current); return; }
    autoRef.current = setInterval(() => {
      setActiveSlide(s => {
        if (s + 1 >= total) { setAutoPlay(false); return s; }
        setDir('fwd'); setAnimKey(k => k + 1);
        return s + 1;
      });
    }, 3500);
    return () => clearInterval(autoRef.current);
  }, [autoPlay, total]);

  /* swipe handlers */
  const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd   = (e) => {
    if (touchX.current === null) return;
    const dx = touchX.current - e.changedTouches[0].clientX;
    if (Math.abs(dx) > 40) goSlide(dx > 0 ? 1 : -1);
    touchX.current = null;
  };

  /* top progress */
  const totalSlides = campaigns.reduce((a, c) => a + c.slides.length, 0);
  const doneSlides  = campaigns.slice(0, activeCamp).reduce((a, c) => a + c.slides.length, 0) + activeSlide + 1;
  const topPct      = Math.round((doneSlides / totalSlides) * 100);

  const bgMap = { '#2c1505': '#2c1505', '#060212': '#060212', '#0f0206': '#0f0206' };
  const slideBg = bgMap[camp.bg] || '#0d0402';

  /* ── shared slide card ── */
  const SlideCard = ({PresMode }) => (
    <div key={`${activeCamp}-${activeSlide}-${animKey}`}
         className={`w-full ${dir === 'fwd' ? 'slide-fwd' : 'slide-back'} ${PresMode ? 'max-w-5xl' : 'max-w-2xl'}`}>
      <div className="relative rounded-3xl overflow-hidden"
           style={{ background: `linear-gradient(145deg, ${slideBg} 0%, #0d0402 100%)`,
             border:'1px solid rgba(255,255,255,.07)',
             boxShadow:`0 0 60px ${accent}18, 0 24px 48px rgba(0,0,0,.5)`,
             minHeight: PresMode ? '520px' : '420px' }}>
        <div className="absolute top-0 left-0 right-0 h-px" style={{background:accent}}/>
        <div className="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-40 rounded-full blur-3xl pointer-events-none"
             style={{background:accent, opacity:.12}}/>
        <div className={`relative z-10 flex flex-col md:flex-row gap-8 ${PresMode ? 'p-6 md:p-12 min-h-[420px] md:min-h-[520px]' : 'p-7 md:p-10 min-h-[420px]'}`}>
          <div className="flex-1 flex flex-col justify-center">
            <div className="inline-flex items-center gap-2 mb-5">
              <div className="w-2 h-2 rounded-full pulse-dot" style={{background:accent}}/>
              <span className={`uppercase tracking-widest font-bold ${PresMode ? 'text-sm' : 'text-xs'}`} style={{color:accent}}>
                {slide.badge}
              </span>
            </div>
            <h1 className={`font-black leading-tight text-white mb-4 ${PresMode ? 'text-3xl md:text-5xl lg:text-6xl' : 'text-3xl md:text-4xl'}`}>
              {slide.headline.map((line,i) => (
                <span key={i} className="block">
                  {i === 1 ? <em className="not-italic" style={{color:accent}}>{line}</em> : line}
                </span>
              ))}
            </h1>
            <p className={`text-white/45 leading-relaxed max-w-sm ${PresMode ? 'text-sm md:text-lg' : 'text-sm md:text-base'}`}>{slide.sub}</p>
          </div>
          <div className="flex-1 flex items-center justify-center">
            {typeof slide.visual === 'function'
              ? slide.visual((key) => setCoffeeOpen(key))
              : slide.visual}
          </div>
        </div>
        <div className="absolute bottom-4 right-5 text-xs font-bold tracking-widest"
             style={{color:`${accent}50`}}>
          {String(activeSlide+1).padStart(2,'0')} / {String(total).padStart(2,'0')}
        </div>
      </div>
    </div>
  );

  /* ── MODO APRESENTAÇÃO ── */
  if (isFullscreen) return (
    <div ref={appRef} className="fixed inset-0 z-[9999] flex flex-col items-center justify-center select-none"
         style={{background:'#0d0402'}}
         onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>

      {/* barra superior: campanha + sair */}
      <div className="absolute top-0 left-0 right-0 flex items-center justify-between px-8 py-4 z-10"
           style={{background:'linear-gradient(to bottom, rgba(13,4,2,.9), transparent)'}}>
        <div className="flex items-center gap-3">
          <span className="text-xl">{camp.emoji}</span>
          <span className="text-white/60 text-sm font-semibold">{camp.title}</span>
          <span className="text-white/20 text-sm">·</span>
          <span className="text-white/35 text-sm">Slide {activeSlide+1} de {total}</span>
        </div>
        <button onClick={toggleFullscreen}
          className="ibtn flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold"
          style={{background:'rgba(255,255,255,.07)', border:'1px solid rgba(255,255,255,.15)', color:'rgba(255,255,255,.5)'}}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <polyline points="8 3 3 3 3 8"/><polyline points="21 8 21 3 16 3"/>
            <polyline points="3 16 3 21 8 21"/><polyline points="16 21 21 21 21 16"/>
          </svg>
          Sair · Esc
        </button>
      </div>

      {/* slide central */}
      <div className="w-full px-4 md:px-16 flex items-center justify-center">
        <SlideCard PresMode={true} />
      </div>

      {/* navegação flutuante na base */}
      <div className="absolute bottom-0 left-0 right-0 flex flex-col items-center gap-3 pb-6 pt-10"
           style={{background:'linear-gradient(to top, rgba(13,4,2,.9), transparent)'}}>
        <div className="flex items-center gap-6">
          <button onClick={() => goSlide(-1)} disabled={activeSlide === 0}
            className="nav-arr w-12 h-12 rounded-full flex items-center justify-center text-lg font-bold disabled:opacity-20 disabled:cursor-not-allowed"
            style={{background:'rgba(255,255,255,.08)', border:'1px solid rgba(255,255,255,.12)', color:'rgba(255,255,255,.7)'}}>
            ←
          </button>
          <div className="flex items-center gap-2">
            {camp.slides.map((_,i) => (
              <button key={i} onClick={() => jumpSlide(i)}
                className="rounded-full transition-all duration-200 hover:opacity-80"
                style={{ height:'7px', width: i === activeSlide ? '24px' : '7px',
                  background: i === activeSlide ? accent : 'rgba(255,255,255,.2)' }}/>
            ))}
          </div>
          <button onClick={() => goSlide(1)} disabled={activeSlide === total-1}
            className="nav-arr w-12 h-12 rounded-full flex items-center justify-center text-lg font-bold disabled:opacity-20 disabled:cursor-not-allowed"
            style={{background:'rgba(255,255,255,.08)', border:'1px solid rgba(255,255,255,.12)', color:'rgba(255,255,255,.7)'}}>
            →
          </button>
        </div>
        {/* mini tabs de campanha */}
        <div className="flex items-center gap-2 flex-wrap justify-center px-4">
          {campaigns.map((c,i) => (
            <button key={c.id} onClick={() => switchCamp(i)}
              className="ibtn flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold"
              style={{ background: activeCamp === i ? `${c.accent}20` : 'rgba(255,255,255,.04)',
                border: `1px solid ${activeCamp === i ? c.accent : 'rgba(255,255,255,.08)'}`,
                color: activeCamp === i ? c.accent : 'rgba(255,255,255,.3)' }}>
              {c.emoji} {c.title}
            </button>
          ))}
        </div>
      </div>

      {coffeeOpen && <CoffeeModal coffeeKey={coffeeOpen} onClose={() => setCoffeeOpen(null)} />}
    </div>
  );

  /* ── MODO NORMAL ── */
  return (
    <div ref={appRef} className="min-h-screen flex flex-col select-none" style={{background:'#0d0402'}}>

      {/* top progress bar */}
      <div className="h-0.5 bg-white/5 flex-shrink-0">
        <div id="top-progress" className="h-full rounded-full" style={{width:`${topPct}%`, background:accent}}/>
      </div>

      {/* header */}
      <div className="flex items-center justify-between px-5 py-3 border-b border-white/5 flex-shrink-0">
        <div className="flex items-center gap-3">
          <div className="text-xl">☕</div>
          <div>
            <div className="text-white font-black text-sm">Cafeteria</div>
            <div className="text-white/25 text-xs">Dashboard de Campanhas</div>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={() => setAutoPlay(p => !p)}
            className="ibtn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition-all"
            style={{ background: autoPlay ? `${accent}20` : 'rgba(255,255,255,.05)',
              border: `1px solid ${autoPlay ? accent : 'rgba(255,255,255,.1)'}`,
              color: autoPlay ? accent : 'rgba(255,255,255,.35)' }}>
            {autoPlay ? '⏸ Pausar' : '▶ Auto'}
          </button>
          <button onClick={toggleFullscreen} title="Apresentação (F)"
            className="fs-btn flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-bold"
            style={{ background:'rgba(255,255,255,.05)', border:'1px solid rgba(255,255,255,.1)', color:'rgba(255,255,255,.5)' }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
              <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
            </svg>
            Apresentar
          </button>
          <div className="hidden sm:flex items-center gap-3 text-xs text-white/20">
            <span>3.636 transações</span><span>·</span><span>3 campanhas</span>
          </div>
        </div>
      </div>

      {/* tabs */}
      <div className="flex border-b border-white/5 flex-shrink-0 overflow-x-auto">
        {campaigns.map((c, i) => (
          <button key={c.id} onClick={() => switchCamp(i)}
            className={`camp-tab flex items-center gap-2 px-5 py-3 text-sm font-semibold whitespace-nowrap flex-shrink-0 ${activeCamp === i ? 'active' : ''}`}
            style={{
              color: activeCamp === i ? '#fff' : 'rgba(255,255,255,.35)',
              borderBottom: activeCamp === i ? `2px solid ${c.accent}` : '2px solid transparent',
            }}>
            <span>{c.emoji}</span>
            <span className="hidden sm:inline">{c.title}</span>
            <span className="inline sm:hidden">{c.id}</span>
          </button>
        ))}
      </div>

      {/* body */}
      <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">

        {/* main slide area */}
        <div className="flex-1 flex flex-col items-center justify-center p-5 lg:p-10"
             onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          <SlideCard PresMode={false} />

          {/* navigation */}
          <div className="flex items-center gap-5 mt-5">
            <button onClick={() => goSlide(-1)} disabled={activeSlide === 0}
              className="nav-arr w-11 h-11 rounded-full flex items-center justify-center text-lg font-bold disabled:opacity-20 disabled:cursor-not-allowed"
              style={{background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.1)', color:'rgba(255,255,255,.6)'}}>
              ←

            <div className="flex items-center gap-2">
              {camp.slides.map((_,i) => (
                <button key={i} onClick={() => jumpSlide(i)}
                  className="rounded-full transition-all duration-200 hover:opacity-80"
                  style={{ height:'6px', width: i === activeSlide ? '20px' : '6px',
                    background: i === activeSlide ? accent : 'rgba(255,255,255,.15)' }}/>
              ))}
            </div>
            <button onClick={() => goSlide(1)} disabled={activeSlide === total-1}
              className="nav-arr w-11 h-11 rounded-full flex items-center justify-center text-lg font-bold disabled:opacity-20 disabled:cursor-not-allowed"
              style={{background:'rgba(255,255,255,.06)', border:'1px solid rgba(255,255,255,.1)', color:'rgba(255,255,255,.6)'}}>
              →
            </button>
          </div>
          <div className="mt-3 text-xs text-white/20">
            Slide {activeSlide+1} de {total} · ← → teclado · F apresentar
          </div>
        </div>

        {/* sidebar */}
        <div className="w-full lg:w-56 border-t lg:border-t-0 lg:border-l border-white/5 p-3 flex flex-col gap-1 overflow-y-auto flex-shrink-0">
          <div className="text-xs uppercase tracking-widest text-white/20 font-bold px-2 mb-1">
            {camp.emoji} {camp.title}
          </div>

          {camp.slides.map((s, i) => (
            <button key={i} onClick={() => jumpSlide(i)}
              className="ibtn text-left px-3 py-2.5 rounded-xl transition-all"
              style={{ background: activeSlide === i ? `${accent}12` : 'transparent',
                border: activeSlide === i ? `1px solid ${accent}35` : '1px solid transparent' }}>
              <div className="flex items-center gap-2">
                <div className="w-5 h-5 rounded-full flex items-center justify-center text-xs font-black flex-shrink-0"
                     style={{background: activeSlide === i ? accent : 'rgba(255,255,255,.06)', color:'#fff'}}>
                  {i+1}
                </div>
                <span className="text-xs font-semibold"
                      style={{color: activeSlide === i ? '#fff' : 'rgba(255,255,255,.35)'}}>
                  {slideLabel[s.type] || s.badge}
                </span>
              </div>
            </button>
          ))}

          {/* stats */}
          <div className="mt-auto pt-3 border-t border-white/5">
            <div className="text-xs uppercase tracking-widest text-white/18 font-bold mb-2 px-1">Dados</div>

              { label:'Melhor dia',  val:'Terça'  },
            ].map((s,i) => (
              <div key={i} className="flex justify-between px-1 py-1.5">
                <span className="text-xs text-white/25">{s.label}</span>
                <span className="text-xs font-bold text-white/50">{s.val}</span>
              </div>
            ))}
          </div>

          {/* keyboard hint */}
          <div className="pt-3 border-t border-white/5 px-1">
            <div className="text-xs text-white/18 leading-relaxed">
              <div className="font-bold text-white/25 mb-1">Atalhos</div>
              <div>← → · navegar slides</div>
              <div>1 2 3 · trocar campanha</div>
              <div>F · tela cheia</div>
              <div>Esc · sair / fechar</div>
            </div>
          </div>
        </div>
      </div>

      {/* coffee modal */}
      {coffeeOpen && <CoffeeModal coffeeKey={coffeeOpen} onClose={() => setCoffeeOpen(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
